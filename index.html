<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screenshottr</title>
<style>
  :root {
    --bg: #16171a;
    --stage: #1e2024;
    --panel: #212327;
    --panel-2: #2a2d32;
    --line: #34373d;
    --text: #e8e9eb;
    --muted: #8d9199;
    --accent: #4c8dff;
    --accent-soft: rgba(76, 141, 255, .16);
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; grid-template-rows: 48px 1fr; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; }

  /* ---------- toolbar ---------- */
  header {
    display: flex; align-items: center; gap: 4px; padding: 0 10px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; letter-spacing: .2px; margin-right: 10px; display: flex; align-items: center; gap: 8px; }
  .brand i { width: 18px; height: 18px; border-radius: 5px; background: linear-gradient(135deg, #ff3b30, #ff9f0a); display: inline-block; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
  .tb {
    height: 34px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; color: var(--text);
  }
  .tb:hover { background: var(--panel-2); }
  .tb.on { background: var(--accent-soft); color: var(--accent); }
  .tb:disabled { opacity: .35; cursor: default; background: transparent; }
  .tb svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tb.label { font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1; }
  #dims { color: var(--muted); font-size: 12px; margin-right: 6px; font-variant-numeric: tabular-nums; }

  /* ---------- layout ---------- */
  main { display: grid; grid-template-columns: 1fr 268px; min-height: 0; }
  #stage { position: relative; overflow: auto; background: var(--stage); min-width: 0; }
  #wrap {
    display: grid; place-items: center; min-width: 100%; min-height: 100%;
    width: max-content; height: max-content; padding: 40px;
  }
  #box { position: relative; display: none; }
  #cv {
    display: block; position: relative; z-index: 1; box-shadow: 0 4px 30px rgba(0,0,0,.45); touch-action: none;
    background: repeating-conic-gradient(#d9d9d9 0 25%, #fff 0 50%) 0 0 / 16px 16px;
  }
  .checker { background: repeating-conic-gradient(#d9d9d9 0 25%, #fff 0 50%) 0 0 / 16px 16px; }

  /* canvas resize frame */
  #frameBg { position: absolute; z-index: 0; display: none; }
  #frameBox {
    position: absolute; z-index: 4; display: none; pointer-events: none;
    outline: 1.5px dashed var(--accent); box-shadow: 0 0 0 100000px rgba(0,0,0,.5);
  }
  #frameBox i {
    position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: #fff; border: 2px solid var(--accent);
    border-radius: 3px; pointer-events: auto; touch-action: none;
  }
  #frameBox i[data-k=nw] { left: 0; top: 0; cursor: nwse-resize; }
  #frameBox i[data-k=n]  { left: 50%; top: 0; cursor: ns-resize; }
  #frameBox i[data-k=ne] { left: 100%; top: 0; cursor: nesw-resize; }
  #frameBox i[data-k=e]  { left: 100%; top: 50%; cursor: ew-resize; }
  #frameBox i[data-k=se] { left: 100%; top: 100%; cursor: nwse-resize; }
  #frameBox i[data-k=s]  { left: 50%; top: 100%; cursor: ns-resize; }
  #frameBox i[data-k=sw] { left: 0; top: 100%; cursor: nesw-resize; }
  #frameBox i[data-k=w]  { left: 0; top: 50%; cursor: ew-resize; }
  #frameLabel {
    position: absolute; left: 50%; top: -30px; transform: translateX(-50%); white-space: nowrap;
    background: #000d; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 5px; font-variant-numeric: tabular-nums;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid2 .lab { margin-bottom: 4px; }
  .sizeRow { display: flex; gap: 12px; align-items: flex-end; }
  .anchor { display: grid; grid-template-columns: repeat(3, 20px); gap: 3px; }
  .anchor button { width: 20px; height: 20px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); cursor: pointer; }
  .anchor button.on { background: var(--accent); border-color: var(--accent); }

  /* library */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: grid; place-items: center; padding: 24px; }
  .modal[hidden] { display: none; }
  .sheet {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(980px, 100%); max-height: 100%;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .sheetHead { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .sheetHead h2 { margin: 0; font-size: 15px; }
  .sheetHead .spacer { flex: 1; }
  .libGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; padding: 16px; overflow: auto; }
  .card {
    position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--panel-2);
    text-align: left;
  }
  .card:hover { border-color: #555a63; }
  .card.cur { border-color: var(--accent); }
  .card .thumb { height: 120px; display: grid; place-items: center; overflow: hidden; }
  .card .thumb img { max-width: 100%; max-height: 120px; display: block; }
  .card .meta { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
  .card .meta b { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta span { font-size: 11px; color: var(--muted); }
  .card .x {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: #000a; color: #fff;
    cursor: pointer; opacity: 0; font-size: 15px; line-height: 1;
  }
  .card:hover .x { opacity: 1; }
  .card .x:hover { background: var(--danger); }
  .libEmpty { color: var(--muted); padding: 24px 16px; }
  #emptyRecent { width: min(900px, 100%); margin-top: 28px; }
  #emptyRecent h3 { margin: 0 4px 0; }
  #emptyRecent .libGrid { padding: 12px 0; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  #editor {
    position: absolute; display: none; margin: 0; border: 0; resize: none; overflow: hidden;
    white-space: pre; outline: 1.5px dashed var(--accent); outline-offset: 3px; z-index: 5;
    user-select: text; -webkit-user-select: text; caret-color: currentColor;
  }
  #editor::placeholder { color: currentColor; opacity: .45; }

  #empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 48px 24px; overflow: auto;
  }
  #empty .drop { margin-top: auto; }
  #empty::after { content: ""; margin-bottom: auto; }
  .drop {
    border: 2px dashed var(--line); border-radius: 16px; padding: 44px 48px; text-align: center; max-width: 460px;
    transition: border-color .15s, background .15s;
  }
  body.dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
  .drop h2 { margin: 0 0 6px; font-size: 20px; }
  .drop p { margin: 0 0 20px; color: var(--muted); }
  kbd {
    font: 600 11px ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 5px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
  }
  .btn {
    height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: #4a4e56; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- panel ---------- */
  #panel {
    background: var(--panel); border-left: 1px solid var(--line);
    display: flex; flex-direction: column; min-height: 0;
  }
  #propsSec { padding: 14px 14px 10px; overflow: auto; flex: 0 1 auto; max-height: 68%; border-bottom: 1px solid var(--line); }
  #histSec { padding: 12px 14px; display: flex; flex-direction: column; min-height: 120px; flex: 1; }
  h3 {
    margin: 0 0 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
  .row { margin-bottom: 12px; }
  .lab { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .rowInline { display: flex; align-items: center; justify-content: space-between; }
  .rowInline .lab { margin: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .sw {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  }
  .sw.on { border-color: var(--text); }
  input[type=color] {
    width: 26px; height: 26px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50%;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 50%; }
  input[type=color]::-moz-color-swatch { border: 1px solid var(--line); border-radius: 50%; }
  .rangeRow { display: flex; align-items: center; gap: 10px; }
  .rangeRow input { flex: 1; accent-color: var(--accent); }
  .val { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 12px; }
  .seg { display: flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button {
    flex: 1; height: 28px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: #3a3e45; color: var(--text); }
  .seg svg { width: 22px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .switch {
    width: 36px; height: 20px; border-radius: 10px; border: 0; background: #464a52; position: relative; cursor: pointer; padding: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .12s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  select, input[type=number] {
    width: 100%; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 0 8px; font: inherit;
  }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .actions .btn { height: 30px; justify-content: center; font-size: 12px; padding: 0 8px; }
  .actions .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  #hist { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  #hist li {
    padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; font-size: 12px;
  }
  #hist li:hover { background: var(--panel-2); }
  #hist li .n { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 18px; font-size: 11px; }
  #hist li.cur { background: var(--accent-soft); color: var(--accent); }
  #hist li.future { opacity: .4; }
  .muted { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: #000c; color: #fff; padding: 9px 16px; border-radius: 9px; transition: opacity .2s, transform .2s; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>Screenshottr</div>
  <button class="tb tool" data-tool="select" title="Select / move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l13 7.5-5.5 1.8L10 18z"/></svg></button>
  <button class="tb tool" data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
  <button class="tb tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
  <button class="tb tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
  <button class="tb tool" data-tool="ellipse" title="Ellipse (E)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg></button>
  <button class="tb tool" data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
  <button class="tb tool" data-tool="step" title="Numbered step (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M10.5 9.5L12.5 8v8"/></svg></button>
  <button class="tb tool" data-tool="redact" title="Redact: pixelate / blur / solid (P)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/><path d="M4 4h8v8H4zM12 12h8v8h-8z" fill="currentColor" stroke="none" opacity=".45"/></svg></button>
  <button class="tb tool" data-tool="canvas" title="Resize canvas (C)"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 002 2h14"/><path d="M18 22V8a2 2 0 00-2-2H2"/></svg></button>
  <div class="sep"></div>
  <button class="tb" id="undoBtn" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></button>
  <button class="tb" id="redoBtn" title="Redo (⇧⌘Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/></svg></button>
  <div class="sep"></div>
  <button class="tb" id="zoomOut" title="Zoom out (⌘−)"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button class="tb label" id="zoomLabel" title="Fit to window (⌘0)">100%</button>
  <button class="tb" id="zoomIn" title="Zoom in (⌘+)"><svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg></button>
  <div class="spacer"></div>
  <span id="dims"></span>
  <button class="tb" id="libBtn" title="Recent images saved in this browser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Recent</button>
  <button class="tb" id="openBtn" title="Open image or .sshot project (⌘O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
  <button class="tb" id="projBtn" title="Save editable project file (.sshot) (⇧⌘S)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Project</button>
  <button class="tb" id="copyBtn" title="Copy image to clipboard (⌘C)"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg>Copy</button>
  <button class="tb" id="saveBtn" title="Export PNG (⌘S)"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PNG</button>
  <input type="file" id="fileInput" accept="image/*,.sshot,.json" hidden>
</header>

<main>
  <div id="stage">
    <div id="wrap">
      <div id="box">
        <div id="frameBg"></div>
        <div id="frameBox"><i data-k="nw"></i><i data-k="n"></i><i data-k="ne"></i><i data-k="e"></i><i data-k="se"></i><i data-k="s"></i><i data-k="sw"></i><i data-k="w"></i><span id="frameLabel"></span></div>
        <canvas id="cv"></canvas>
        <textarea id="editor" spellcheck="false" placeholder="Type…"></textarea>
      </div>
    </div>
    <div id="empty">
      <div class="drop">
        <h2>Paste a screenshot</h2>
        <p>Press <kbd>⌘V</kbd> / <kbd>Ctrl V</kbd>, or drop an image or <code>.sshot</code> project anywhere.</p>
        <button class="btn primary" id="emptyOpen">Open…</button>
        <button class="btn" id="emptyBlank">Blank canvas</button>
      </div>
      <div id="emptyRecent"></div>
    </div>
  </div>

  <aside id="panel">
    <section id="propsSec">
      <h3 id="propsTitle">Properties</h3>
      <div id="props"></div>
    </section>
    <section id="histSec">
      <h3>History <span class="muted" id="histCount"></span></h3>
      <ol id="hist"></ol>
    </section>
  </aside>
</main>
<div id="libModal" class="modal" hidden>
  <div class="sheet">
    <div class="sheetHead">
      <h2>Recent images</h2><span class="muted">Saved automatically in this browser</span>
      <span class="spacer"></span>
      <button class="btn" id="libClear">Clear all</button>
      <button class="btn" id="libClose">Close</button>
    </div>
    <div class="libGrid" id="libGrid"></div>
  </div>
</div>
<div id="toast"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
const ta = $('#editor'), stage = $('#stage'), panel = $('#panel');
const mctx = document.createElement('canvas').getContext('2d'); // for text measurement

const FONTS = {
  system: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif',
  serif: 'Georgia, "Times New Roman", serif',
  mono: 'ui-monospace, Menlo, Consolas, monospace',
  hand: '"Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive',
};
const SWATCHES = ['#ff3b30', '#ff9f0a', '#ffd60a', '#34c759', '#0a84ff', '#bf5af2', '#ffffff', '#1c1c1e'];
const NAMES = { arrow: 'Arrow', line: 'Line', rect: 'Rectangle', ellipse: 'Ellipse', text: 'Text', step: 'Step', redact: 'Redact', canvas: 'Canvas' };
const BG_SWATCHES = ['#ffffff', '#f2f2f7', '#d1d1d6', '#1c1c1e', '#000000', '#0a84ff', '#ff3b30', '#ffd60a'];
const ACCENT = '#4c8dff';
const HANDLE = 9;

const DEFAULTS = {
  arrow:   { color: '#ff3b30', width: 5, heads: 'end', headStyle: 'filled', dash: 'solid', opacity: 1 },
  line:    { color: '#ff3b30', width: 5, dash: 'solid', opacity: 1 },
  rect:    { color: '#ff3b30', width: 5, fillOn: false, fill: '#ffd60a', radius: 6, dash: 'solid', opacity: 1 },
  ellipse: { color: '#ff3b30', width: 5, fillOn: false, fill: '#ffd60a', dash: 'solid', opacity: 1 },
  text:    { color: '#ffffff', fontSize: 28, fontFamily: 'system', bold: true, italic: false, underline: false, strike: false,
             outline: false, bgOn: true, bgColor: '#ff3b30', padding: 8, radius: 6, opacity: 1 },
  step:    { color: '#ff3b30', textColor: '#ffffff', size: 40, opacity: 1 },
  redact:  { mode: 'pixelate', strength: 12 },
};
const PROPS = {
  arrow:   ['color', 'width', 'heads', 'headStyle', 'dash', 'opacity'],
  line:    ['color', 'width', 'dash', 'opacity'],
  rect:    ['color', 'width', 'dash', 'radius', 'fillOn', 'fill', 'opacity'],
  ellipse: ['color', 'width', 'dash', 'fillOn', 'fill', 'opacity'],
  text:    ['color', 'fontSize', 'fontFamily', 'format', 'outline', 'bgOn', 'bgColor', 'padding', 'radius', 'opacity'],
  step:    ['n', 'color', 'textColor', 'size', 'opacity'],
  redact:  ['mode', 'strength'],
};
const headIcon = (l, r) => `<svg viewBox="0 0 22 14"><path d="M3 7h16"/>${l ? '<path d="M7 3L3 7l4 4"/>' : ''}${r ? '<path d="M15 3l4 4-4 4"/>' : ''}</svg>`;
const CTRL = {
  color:     { label: 'Color', kind: 'color' },
  width:     { label: 'Weight', kind: 'range', min: 1, max: 40, step: 1, minFor: { rect: 0, ellipse: 0 } },
  heads:     { label: 'Arrowheads', kind: 'seg', options: [['none', headIcon(0, 0)], ['start', headIcon(1, 0)], ['end', headIcon(0, 1)], ['both', headIcon(1, 1)]] },
  headStyle: { label: 'Head style', kind: 'seg', options: [['filled', 'Filled'], ['open', 'Open']] },
  dash:      { label: 'Line style', kind: 'seg', options: [['solid', 'Solid'], ['dashed', 'Dashed'], ['dotted', 'Dotted']] },
  opacity:   { label: 'Opacity', kind: 'range', min: 0.1, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
  fillOn:    { label: 'Fill', kind: 'toggle' },
  fill:      { label: 'Fill color', kind: 'color', showIf: o => o.fillOn },
  radius:    { label: 'Corner radius', kind: 'range', min: 0, max: 40, step: 1, showIf: o => o.type !== 'text' || o.bgOn },
  fontSize:  { label: 'Font size', kind: 'range', min: 8, max: 200, step: 1 },
  fontFamily:{ label: 'Font', kind: 'select', options: [['system', 'Sans'], ['serif', 'Serif'], ['mono', 'Monospace'], ['hand', 'Handwritten']] },
  format:    { label: 'Style', kind: 'format' },
  outline:   { label: 'Outline', kind: 'toggle' },
  bgOn:      { label: 'Background', kind: 'toggle' },

  }
  cv.style.cursor = cursor;
  if (h !== hoverId) { hoverId = h; render(); }
}

// ---------- properties panel ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function setProp(key, val, commit) {
  const o = sel();
  const type = o ? o.type : tool;
  if (o) o[key] = val;
  if (styles[type] && !CTRL[key]?.noStyle) { styles[type][key] = val; saveStyles(); }
  if (editing) styleEditor();
  render();
  if (commit && o && !editing) pushHistory(`${NAMES[o.type]}: ${(CTRL[key]?.label || key).toLowerCase()}`, o.id + ':' + key);
}
function buildControl(key, t) {
  const d = CTRL[key];
  const row = el('div', 'row');
  const lab = el('label', 'lab', d.label);
  row.append(lab);
  switch (d.kind) {
    case 'color': {
      const wrap = el('div', 'swatches');
      for (const c of SWATCHES) {
        const b = el('button', 'sw' + (t[key].toLowerCase() === c ? ' on' : ''));
        b.style.background = c; b.title = c;
        b.onclick = () => { setProp(key, c, true); refreshPanel(); };
        wrap.append(b);
      }
      const inp = el('input');
      inp.type = 'color'; inp.value = t[key]; inp.title = 'Custom color';
      inp.oninput = () => setProp(key, inp.value, false);
      inp.onchange = () => { setProp(key, inp.value, true); refreshPanel(); };
      wrap.append(inp);
      row.append(wrap);
      break;
    }
    case 'range': {
      const wrap = el('div', 'rangeRow');
      const inp = el('input'), fmt = d.fmt || (v => String(v));
      const min = d.minFor && t.type in d.minFor ? d.minFor[t.type] : d.min;
      Object.assign(inp, { type: 'range', min, max: d.max, step: d.step });
      inp.value = t[key];
      const out = el('span', 'val', fmt(t[key]));
      inp.oninput = () => { out.textContent = fmt(+inp.value); setProp(key, +inp.value, false); };
      inp.onchange = () => setProp(key, +inp.value, true);
      wrap.append(inp, out);
      row.append(wrap);
      break;
    }
    case 'seg': {
      const wrap = el('div', 'seg');
      for (const [v, label] of d.options) {
        const b = el('button', t[key] === v ? 'on' : '');
        b.innerHTML = label; b.title = v;
        b.onclick = () => { setProp(key, v, true); refreshPanel(); };
        wrap.append(b);
      }
      row.append(wrap);
      break;
    }
    case 'toggle': {
      row.className = 'row rowInline';
      const b = el('button', 'switch' + (t[key] ? ' on' : ''));
      b.onclick = () => { setProp(key, !t[key], true); refreshPanel(); };
      row.append(b);
      break;
    }
    case 'select': {
      const s = el('select');
      for (const [v, label] of d.options) { const op = el('option', '', label); op.value = v; s.append(op); }
      s.value = t[key];
      s.onchange = () => { setProp(key, s.value, true); if (editing) ta.focus(); };
      row.append(s);
      break;
    }
    case 'number': {
      const inp = el('input');
      inp.type = 'number'; inp.min = 0; inp.value = t[key];
      inp.oninput = () => setProp(key, inp.value, false);
      inp.onchange = () => setProp(key, inp.value, true);
      row.append(inp);
      break;
    }
    case 'format': {
      const wrap = el('div', 'seg');
      const fmts = [['bold', 'B', 'font-weight:800'], ['italic', 'I', 'font-style:italic;font-family:Georgia,serif'],
                    ['underline', 'U', 'text-decoration:underline'], ['strike', 'S', 'text-decoration:line-through']];
      for (const [k, label, css] of fmts) {
        const b = el('button', t[k] ? 'on' : '');
        b.innerHTML = `<span style="${css};font-size:14px">${label}</span>`;
        b.title = k;
        b.onclick = () => { setProp(k, !t[k], true); refreshPanel(); };
        wrap.append(b);
      }
      row.append(wrap);
      break;
    }
  }
  return row;
}
function refreshPanel() {
  const props = $('#props'), title = $('#propsTitle');
  props.innerHTML = '';
  const o = sel();
  const type = o ? o.type : (tool !== 'select' ? tool : null);
  if (!base) {
    title.textContent = 'Properties';
    props.append(el('p', 'hint', 'Paste or open a screenshot to start annotating.'));
    return;
  }
  if (tool === 'canvas') {
    title.innerHTML = '';
    title.append('Canvas', el('span', 'muted', `${frame.w} × ${frame.h}`));
    buildCanvasPanel(props);
    return;
  }
  if (!type) {
    title.textContent = 'Properties';
    props.append(el('p', 'hint', 'Select an annotation to edit it, or pick a tool to draw. Double-click empty space to add text.'));
    const a = el('div', 'actions');
    const rc = el('button', 'btn', 'Resize canvas…');
    rc.style.gridColumn = '1 / -1';
    rc.onclick = () => setTool('canvas');
    a.append(rc);
    if (objects.length) {
      const b = el('button', 'btn danger', 'Clear all annotations');
      b.style.gridColumn = '1 / -1';
      b.onclick = () => { objects = []; selId = null; pushHistory('Clear all'); refreshPanel(); render(); };
      a.append(b);
    }
    props.append(a);
    return;
  }
  const t = o || { type, ...styles[type] };
  title.innerHTML = '';
  title.append(NAMES[type], el('span', 'muted', o ? 'selected' : 'new drawings'));
  for (const key of PROPS[type]) {
    const d = CTRL[key];
    if (d.showIf && !d.showIf(t)) continue;
    if (d.noStyle && !o) continue;
    props.append(buildControl(key, t));
  }
  if (o) {
    const a = el('div', 'actions');
    const mk = (label, fn, cls = '') => { const b = el('button', 'btn ' + cls, label); b.onclick = fn; a.append(b); };
    if (o.type === 'text') mk('Edit text', () => startEdit(o, false));
    mk('Duplicate', duplicate);
    mk('Bring to front', () => reorder(1));
    mk('Send to back', () => reorder(-1));
    mk('Delete', del, 'danger');
    props.append(a);
  }
}

// ---------- object actions ----------
function del() {
  const o = sel();
  if (!o) return;
  commitEdit();
  if (!get(o.id)) return;
  objects = objects.filter(x => x !== o);
  selId = null;
  pushHistory('Delete ' + NAMES[o.type].toLowerCase());
  refreshPanel(); render();
}
function duplicate() {
  const o = sel();
  if (!o) return;
  commitEdit();
  const c = clone(o), off = 20;
  c.id = nextId++;
  if ('x1' in c) { c.x1 += off; c.y1 += off; c.x2 += off; c.y2 += off; } else { c.x += off; c.y += off; }
  objects.push(c); selId = c.id;
  pushHistory('Duplicate ' + NAMES[c.type].toLowerCase());
  refreshPanel(); render();
}
function reorder(dir) {
  const o = sel();
  if (!o) return;
  objects = objects.filter(x => x !== o);
  dir > 0 ? objects.push(o) : objects.unshift(o);
  pushHistory(dir > 0 ? 'Bring to front' : 'Send to back');
  render();
}
function nudge(dx, dy) {
  const o = sel();
  if (!o) return;
  if ('x1' in o) { o.x1 += dx; o.y1 += dy; o.x2 += dx; o.y2 += dy; } else { o.x += dx; o.y += dy; }
  pushHistory('Nudge ' + NAMES[o.type].toLowerCase(), 'nudge:' + o.id);
  render();
}
function setTool(t) {
  commitEdit();
  tool = t;
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  const s = sel();
  if (s && t !== 'select' && s.type !== t) selId = null;
  cv.style.cursor = t === 'select' || t === 'canvas' ? 'default' : t === 'text' ? 'text' : 'crosshair';
  resetFrameRect();
  updateFrameBox();
  refreshPanel(); render();
}
// After drawing something, go back to Select (keeping it selected) without ending a text edit.
function selectMode() {
  tool = 'select';
  document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === 'select'));
  cv.style.cursor = 'default';
  refreshPanel();
}

// ---------- wiring ----------
document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('#undoBtn').onclick = undo;
$('#redoBtn').onclick = redo;
$('#zoomIn').onclick = () => zoomStep(1);
$('#zoomOut').onclick = () => zoomStep(-1);
$('#zoomLabel').onclick = fit;
$('#copyBtn').onclick = copyImage;
$('#saveBtn').onclick = saveImage;
$('#projBtn').onclick = saveProject;
$('#libBtn').onclick = openLibrary;
$('#libClose').onclick = closeLibrary;
$('#libModal').onclick = e => { if (e.target === e.currentTarget) closeLibrary(); };
$('#libClear').onclick = async () => {
  if (!confirm('Remove all images from the local library? Your current image stays open.')) return;
  try { await DB.clear(); } catch (e) {}
  renderLibrary($('#libGrid'));
};
$('#openBtn').onclick = $('#emptyOpen').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('#emptyBlank').onclick = () => {
  const c = document.createElement('canvas');
  c.width = 1600; c.height = 1000;
  openDoc(c, { name: 'Blank canvas', label: 'Blank canvas' });
};
for (const b of ['#copyBtn', '#saveBtn', '#projBtn', '#zoomIn', '#zoomOut', '#zoomLabel']) $(b).disabled = true;

document.addEventListener('paste', e => {
  if (editing || e.target.closest?.('input, textarea, select')) return;
  const items = e.clipboardData ? [...e.clipboardData.items] : [];
  const img = items.find(it => it.type.startsWith('image/'));
  if (img) { e.preventDefault(); loadFile(img.getAsFile()); return; }
  const text = e.clipboardData && e.clipboardData.getData('text/plain');
  if (text && base) {
    e.preventDefault();
    const r = stage.getBoundingClientRect(), c = cv.getBoundingClientRect();
    const x = clamp((r.left + r.width / 2 - c.left) / zoom, 0, frame.w - 50);
    const y = clamp((r.top + r.height / 2 - c.top) / zoom, 0, frame.h - 50);
    newObj('text', { x, y, text });
    pushHistory('Paste text');
    selectMode(); render();
  }
});
window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  document.body.classList.remove('dragging');
  const f = [...(e.dataTransfer?.files || [])].find(f => f.type.startsWith('image/') || /\.(sshot|json)$/i.test(f.name));
  if (f) { closeLibrary(); loadFile(f); }
});
stage.addEventListener('wheel', e => {
  if (!base || !(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  zoomAt(zoom * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
}, { passive: false });

const TOOL_KEYS = { v: 'select', a: 'arrow', l: 'line', r: 'rect', e: 'ellipse', t: 'text', n: 'step', p: 'redact', c: 'canvas' };
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (!$('#libModal').hidden) {
    if (e.key === 'Escape') closeLibrary();
    return;
  }
  if (mod && k === 'o') { e.preventDefault(); commitEdit(); $('#fileInput').click(); return; }
  if (editing) {
    if (e.key === 'Escape' || (e.key === 'Enter' && mod)) { e.preventDefault(); commitEdit(); }
    return;
  }
  const tgt = e.target;
  if (tgt.closest && tgt.closest('textarea, select, input:not([type=range]):not([type=color])')) return;
  if (tgt.type === 'range' && e.key.startsWith('Arrow')) return;

  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 's') { e.preventDefault(); e.shiftKey ? saveProject() : saveImage(); return; }
  if (mod && k === 'c') {
    if (String(window.getSelection())) return;
    e.preventDefault(); copyImage(); return;
  }
  if (mod && k === 'd') { e.preventDefault(); duplicate(); return; }
  if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomStep(1); return; }
  if (mod && k === '-') { e.preventDefault(); zoomStep(-1); return; }
  if (mod && k === '0') { e.preventDefault(); fit(); return; }
  if (mod && k === '1') { e.preventDefault(); setZoom(1); return; }
  if (mod || e.altKey) return;

  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); del(); return; }
  if (e.key === 'Escape') {
    if (drag) return;
    if (selId != null) { selId = null; refreshPanel(); render(); } else setTool('select');
    return;
  }
  if (e.key === 'Enter') { const o = sel(); if (o && o.type === 'text') { e.preventDefault(); startEdit(o, false); } return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && sel()) {
    e.preventDefault();
    const m = e.shiftKey ? 10 : 1;
    nudge(arrows[e.key][0] * m, arrows[e.key][1] * m);
    return;
  }
  if (e.key === ']') { reorder(1); return; }
  if (e.key === '[') { reorder(-1); return; }
  if (TOOL_KEYS[k] && base) { setTool(TOOL_KEYS[k]); return; }
});

// flush pending autosave when leaving
window.addEventListener('pagehide', () => { if (saveT) { clearTimeout(saveT); saveDoc(); } });

setTool('select');
renderHistory();
renderEmptyRecent();
</script>
</body>
</html>
